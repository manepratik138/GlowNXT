<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e11d48"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fcd34d"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Sparkle / Star center -->
  <g transform="translate(32,32)" fill="url(#star)">
    <!-- Center diamond -->
    <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" opacity="1"/>
    <!-- Small sparkles -->
    <circle cx="16" cy="-16" r="3" opacity="0.8"/>
    <circle cx="-18" cy="14" r="2" opacity="0.6"/>
    <circle cx="14" cy="18" r="2.5" opacity="0.7"/>
  </g>
</svg>
