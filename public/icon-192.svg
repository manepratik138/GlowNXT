<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="60%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="star192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg192)"/>
  
  <!-- Outer subtle ring -->
  <circle cx="96" cy="76" r="46" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  
  <!-- Glowing central star/sparkle -->
  <g transform="translate(96,76)" fill="url(#star192)" filter="url(#glow192)">
    <polygon points="0,-36 7,-9 36,0 7,9 0,36 -7,9 -36,0 -7,-9"/>
    <circle cx="28" cy="-26" r="5" opacity="0.9" fill="#fef08a"/>
    <circle cx="-28" cy="22" r="4" opacity="0.8" fill="#fef08a"/>
    <circle cx="24" cy="26" r="3.5" opacity="0.7" fill="#ffffff"/>
  </g>
  
  <!-- GlowNXT text -->
  <text x="96" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="0.5">Glow<tspan fill="#fbcfe8">NXT</tspan></text>
  <text x="96" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="rgba(255,255,255,0.7)" letter-spacing="3">SALON &amp; SPA</text>
</svg>
