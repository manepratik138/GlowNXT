<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="60%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="star512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg512)"/>
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="204" r="120" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="5"/>
  
  <!-- Glowing central star/sparkle -->
  <g transform="translate(256,204)" fill="url(#star512)" filter="url(#glow512)">
    <polygon points="0,-95 18,-24 95,0 18,24 0,95 -18,24 -95,0 -18,-24"/>
    <circle cx="75" cy="-70" r="13" opacity="0.9" fill="#fef08a"/>
    <circle cx="-75" cy="60" r="11" opacity="0.8" fill="#fef08a"/>
    <circle cx="65" cy="70" r="9" opacity="0.7" fill="#ffffff"/>
  </g>
  
  <!-- GlowNXT text -->
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="1">Glow<tspan fill="#fbcfe8">NXT</tspan></text>
  <text x="256" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" fill="rgba(255,255,255,0.75)" letter-spacing="8">SALON &amp; SPA AT HOME</text>
</svg>
